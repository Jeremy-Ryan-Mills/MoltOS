[package]
name = "chronos"
version = "0.1.0"
edition = "2024"

[package.metadata.bootimage]
run-args = ["-m", "256M", "-serial", "stdio", "-drive", "file=disk.cxfs,format=raw,if=ide,index=1,media=disk"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", 
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 300 # (in seconds)

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "uptime"
harness = false

[[test]]
name = "threading"
harness = true

[[test]]
name = "scheduler_round_robin"
harness = true

[[test]]
name = "scheduler_eevdf"
harness = true

[[test]]
name = "sync"
harness = true

[[test]]
name = "kmutex_concurrent"
harness = false

# [profile.dev]
# panic = "abort" # disable stack unwinding on panic

# [profile.release]
# panic = "abort" # disable stack unwinding on panic

[[bin]]
name = "chronos"
test = false
bench = false

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[build-dependencies]
cc = "1.0"

[dev-dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
x86_64 = "0.14.2"