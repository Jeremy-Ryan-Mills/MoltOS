[package]
name = "chronos"
version = "0.1.0"
edition = "2024"

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", 
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 300 # (in seconds)

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "uptime"
harness = false

[[test]]
name = "threading"
harness = true

[[test]]
name = "scheduler_round_robin"
harness = true

[[test]]
name = "scheduler_eevdf"
harness = true

# [profile.dev]
# panic = "abort" # disable stack unwinding on panic

# [profile.release]
# panic = "abort" # disable stack unwinding on panic

[[bin]]
name = "chronos"
test = true
bench = false

[dependencies]
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# x86_64-only: bootloader, CPU/port/IDT, serial, keyboard, heap, async
[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"

[target.'cfg(target_arch = "x86_64")'.dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[target.'cfg(target_arch = "x86_64")'.dependencies.conquer-once]
version = "0.2.0"
default-features = false

[target.'cfg(target_arch = "x86_64")'.dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[dev-dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
x86_64 = "0.14.2"